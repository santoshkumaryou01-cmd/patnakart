
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatnaKart Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f5f9;color:#222}
header{background:#172554;color:white;padding:18px}
header h1{color:#facc15;margin:0}
.search{padding:14px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px}
h2{padding:0 14px}
.categories,.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.category,.product,.cartbox{background:white;padding:14px;border-radius:12px;text-align:center;box-shadow:0 2px 7px #ddd}
.emoji{font-size:38px}
.price{color:green;font-weight:bold}
button{background:#172554;color:white;border:0;border-radius:7px;padding:10px;margin:4px}
.cartbox{margin:14px;text-align:left}
.cartitem{border-bottom:1px solid #ddd;padding:12px 0}
.cartitem button{padding:7px 12px}
.total{font-size:20px;font-weight:bold;color:green}
#cart{cursor:pointer}
footer{background:#172554;color:white;text-align:center;padding:20px}
</style>
</head>
<body>

<header>
<h1>🛍️ PatnaKart</h1>
<p>पटना का अपना ऑनलाइन बाजार</p>
</header>

<div class="search">
<input id="search" placeholder="प्रोडक्ट खोजें..." oninput="showProducts()">
</div>

<h2>Shop by Category</h2>
<div class="categories">
<div class="category">👕<p>कपड़े</p></div>
<div class="category">👟<p>जूते</p></div>
<div class="category">🕶️<p>चश्मे</p></div>
<div class="category">⌚<p>घड़ी</p></div>
<div class="category">👜<p>बैग और बेल्ट</p></div>
<div class="category">✨<p>नए प्रोडक्ट</p></div>
</div>

<h2>Featured Products</h2>
<div class="products" id="products"></div>

<h2 id="cart" onclick="toggleCart()">
🛒 My Cart (<span id="count">0</span>) — View Cart
</h2>

<div class="cartbox" id="cartbox" style="display:none">
<h3>आपका Shopping Cart</h3>
<div id="cartlist"></div>
<p class="total">Total: ₹<span id="total">0</span></p>
<button onclick="alert('Checkout का अगला चरण जल्द जोड़ेंगे!')">
Proceed to Checkout
</button>
</div>

<footer>
<h3>PatnaKart</h3>
<p>पटना का अपना ऑनलाइन बाजार।</p>
</footer>

<script>
const products=[
{id:1,name:"Men's T-Shirt",price:299,emoji:"👕"},
{id:2,name:"Casual Shoes",price:799,emoji:"👟"},
{id:3,name:"Fashion Sunglasses",price:249,emoji:"🕶️"},
{id:4,name:"Stylish Watch",price:499,emoji:"⌚"},
{id:5,name:"Fashion Belt",price:199,emoji:"🧷"},
{id:6,name:"Travel Bag",price:599,emoji:"👜"}
];

let cart={};

function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=
products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`
<div class="product">
<div class="emoji">${p.emoji}</div>
<h3>${p.name}</h3>
<p class="price">₹${p.price}</p>
<button onclick="addCart(${p.id})">Add to Cart</button>
</div>`).join("");
}

function addCart(id){
cart[id]=(cart[id]||0)+1;
updateCart();
}

function changeQty(id,change){
cart[id]=(cart[id]||0)+change;
if(cart[id]<=0) delete cart[id];
updateCart();
}

function removeItem(id){
delete cart[id];
updateCart();
}

function updateCart(){
let count=0,total=0;
let html="";
products.forEach(p=>{
let qty=cart[p.id]||0;
if(qty>0){
count+=qty;
total+=p.price*qty;
html+=`
<div class="cartitem">
<strong>${p.emoji} ${p.name}</strong>
<p>Price: ₹${p.price}</p>
<button onclick="changeQty(${p.id},-1)">−</button>
${qty}
<button onclick="changeQty(${p.id},1)">+</button>
<button onclick="removeItem(${p.id})">Remove</button>
<p>Subtotal: ₹${p.price*qty}</p>
</div>`;
}
});
document.getElementById("count").innerText=count;
document.getElementById("cartlist").innerHTML=
html||"आपका Cart अभी खाली है।";
document.getElementById("total").innerText=total;
}

function toggleCart(){
let box=document.getElementById("cartbox");
box.style.display=box.style.display==="none"?"block":"none";
updateCart();
}

showProducts();
updateCart();
</script>
</body>
</html>
